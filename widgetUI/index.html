<div id="chatbot-widget-root">

  <div class="chat-panel" id="chatPopup" role="dialog" aria-label="Store Assistant chat" aria-hidden="true">
    <div class="widget-header">
      <span class="dot"></span>Store Assistant
      <button type="button" id="closeBtn" class="chat-close-btn" aria-label="Close chat">✕</button>
    </div>
    <div id="chatBody"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
      <button type="button" id="sendBtn">Send</button>
    </div>
  </div>

  <button type="button" id="chatTrigger" class="chat-toggle-btn" aria-label="Open support chat" aria-expanded="false">
    💬 Support
  </button>

</div>
